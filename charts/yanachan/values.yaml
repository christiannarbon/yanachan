# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name. With the release named yanachan this is already yanachan.
fullnameOverride: ""

global:
  # -- Registry host that replaces image.registry, for mirrors and air-gapped installs.
  imageRegistry: ""
  # -- Pull secrets added to the pod, for example for a private mirror.
  imagePullSecrets: []

image:
  # -- Registry host. Empty means the repository is used as written.
  registry: ghcr.io
  # -- Image repository.
  repository: christiannarbon/yanachan
  # -- Image tag. Empty means the chart's appVersion.
  tag: ""
  # -- Image digest (sha256:...). When set it wins over the tag.
  digest: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

serviceAccount:
  # -- Create a ServiceAccount for the pod. It never mounts a token either way.
  create: true
  # -- Name of the ServiceAccount. Empty means the full name.
  name: ""
  # -- Annotations for the ServiceAccount.
  annotations: {}

auth:
  # -- server (every user signs in with GitHub; sessions in Redis/Valkey; stateless) or local (one stored token, no login, port-forward only, PVC).
  mode: server
  # -- URL users open, scheme and host only, no path (GHDASH_PUBLIC_URL). Required in server mode. The OAuth App's callback is this plus /api/auth/callback.
  publicURL: ""
  # -- OAuth App (the default) or GitHub App client ID (GITHUB_CLIENT_ID). Not a secret. Required in server mode; in local mode empty means the Secret's clientId key, if any.
  clientId: ""
  # -- Secret holding the credentials. Empty means the full name. The chart never creates it.
  existingSecret: ""
  secretKeys:
    # -- Key holding the GitHub client secret (server mode, required).
    clientSecret: github-client-secret
    # -- Key holding GHDASH_SESSION_KEYS, comma-separated base64 32-byte keys (server mode, required).
    sessionKeys: session-keys
    # -- Key holding the Redis/Valkey password. Required with the bundled Valkey (it sets Valkey's password); optional for an external Redis.
    redisPassword: redis-password
    # -- Key holding a GitHub token (local mode only, optional).
    token: gh-token
    # -- Key holding the OAuth client ID (local mode only, optional, for the device flow).
    clientId: github-client-id
  # -- Organisations whose members may sign in (GHDASH_ALLOWED_ORGS).
  allowedOrgs: []
  # -- Individual GitHub logins, or id:<n> user IDs, that may sign in (GHDASH_ALLOWED_USERS).
  allowedUsers: []
  # -- Let any GitHub user sign in (GHDASH_ALLOW_ANY_USER). Server mode needs this, allowedOrgs or allowedUsers.
  allowAnyUser: false
  # -- Idle session lifetime, a Go duration such as 168h (GHDASH_SESSION_IDLE). Empty means the app default.
  sessionIdle: ""
  # -- Absolute session lifetime, a Go duration such as 720h (GHDASH_SESSION_MAX). Empty means the app default.
  sessionMax: ""
  # -- Token rotation policy for both app kinds, a Go duration between 15m and sessionMax (GHDASH_TOKEN_MAX_AGE). Empty means the app default, 8h.
  tokenMaxAge: ""
  # -- Override for sessions without a refresh token: OAuth Apps, and GitHub Apps with token expiry off (GHDASH_OAUTH_APP_TOKEN_MAX_AGE). Each rotation is a brief redirect for the user. Empty means tokenMaxAge.
  oauthAppTokenMaxAge: ""
  # -- Override for sessions with a refresh token: GitHub Apps with expiring tokens (GHDASH_GITHUB_APP_TOKEN_MAX_AGE). Refreshes are invisible, so a short value costs users nothing. Empty means tokenMaxAge.
  githubAppTokenMaxAge: ""
  redis:
    # -- External Redis/Valkey URL (GHDASH_REDIS_URL), only with valkey.enabled=false. redis://host:6379/0 or rediss://host:6378 for TLS. Never put a password in it; use the redis-password Secret key.
    url: ""
    # -- Key prefix (GHDASH_REDIS_PREFIX), so several installs can share one instance. Empty means the app default, yana:.
    prefix: ""
    # -- ConfigMap holding the CA bundle for rediss:// with a private CA (Memorystore in-transit encryption). Mounted read-only; sets GHDASH_REDIS_CA_FILE.
    caConfigMap: ""
    # -- Secret holding the CA bundle instead of a ConfigMap. Set at most one of caConfigMap and caSecret.
    caSecret: ""
    # -- Key inside the ConfigMap or Secret that holds the PEM bundle.
    caKey: ca.crt

github:
  # -- GraphQL endpoint. Change it for GitHub Enterprise Server (untested).
  graphqlEndpoint: https://api.github.com/graphql
  # -- Web URL users sign in at (web flow and device flow). Change it for GitHub Enterprise Server (untested).
  webUrl: https://github.com
  # -- REST endpoint, used only to revoke a token on sign-out. GitHub Enterprise Server: https://HOST/api/v3 (untested).
  restEndpoint: https://api.github.com

# -- Number of pods. Server mode only (stateless); local mode must leave it at 1.
replicaCount: 1

pdb:
  # -- Render a PodDisruptionBudget (maxUnavailable 1). Server mode with replicaCount > 1 only.
  enabled: false

service:
  # -- Service type. Local mode has no login, so keep it ClusterIP and reach it through a port-forward.
  type: ClusterIP
  # -- Service port.
  port: 19080
  # -- Service annotations.
  annotations: {}

persistence:
  # -- Local mode only: size of the state volume holding settings.json and session.json. Server mode mounts no volume.
  size: 1Gi
  # -- StorageClass for the state volume. Empty means the cluster default.
  storageClass: ""
  # -- Use an existing PVC instead of creating one.
  existingClaim: ""
  # -- Annotations for the PVC.
  annotations: {}

# -- Starting value for the per-query pull request cap (GHDASH_LIMIT).
defaultLimit: 25

# -- Pod security context. Set runAsUser and fsGroup to null on OpenShift.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# -- Container resources.
resources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    cpu: 500m
    memory: 256Mi

# -- Readiness: /api/ready answers 503 in server mode while Redis is unreachable, so the pod leaves the Service without restarting.
readinessProbe:
  httpGet:
    path: /api/ready
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10

# -- Liveness: /api/health never touches Redis.
livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

# -- Extra pod annotations.
podAnnotations: {}
# -- Extra pod labels.
podLabels: {}

valkey:
  # -- Run a Valkey for sessions and settings inside the release (server mode only). Set false and set auth.redis.url to use a managed Redis/Valkey instead.
  enabled: true
  image:
    # -- Registry host. global.imageRegistry replaces it, as for the app image.
    registry: docker.io
    # -- Image repository.
    repository: valkey/valkey
    # -- Image tag.
    tag: "9.1.3-alpine"
    # -- Multi-arch index digest. When set it wins over the tag.
    digest: "sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b"
    # -- Image pull policy.
    pullPolicy: IfNotPresent
  persistence:
    # -- Keep Valkey's data (AOF) on a PVC, so a Valkey restart keeps sessions and settings. Off: an emptyDir, and every Valkey restart signs everyone out and resets their settings.
    enabled: true
    # -- PVC size.
    size: 1Gi
    # -- StorageClass. Empty means the cluster default.
    storageClass: ""
    # -- What happens to the PVC when the release is uninstalled (Retain or Delete).
    whenDeleted: Retain
  # -- maxmemory for Valkey. Keep it below resources.limits.memory. Eviction is off (noeviction): a full Valkey refuses writes rather than silently signing users out.
  maxmemory: 192mb
  # -- Container resources.
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # -- Pod security context. The IDs are the image's valkey user and group. Set runAsUser, runAsGroup and fsGroup to null on OpenShift.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  # -- Container security context.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  # -- Node selector for the Valkey pod.
  nodeSelector: {}
  # -- Tolerations for the Valkey pod.
  tolerations: []
  # -- Affinity for the Valkey pod.
  affinity: {}
  # -- Extra pod annotations.
  podAnnotations: {}

exposure:
  # -- Local mode only: what authenticates users in front of the dashboard, for example oauth2-proxy. Required in local mode when ingress, httpRoute or a non-ClusterIP service exposes the pod. Ignored in server mode, which authenticates by itself.
  authenticatedBy: ""

# -- Extra Host names the app answers to (GHDASH_ALLOWED_HOSTS). Ingress and HTTPRoute hosts, and the auth.publicURL host, are added automatically.
allowedHosts: []

ingress:
  # -- Render an Ingress. In local mode it needs exposure.authenticatedBy.
  enabled: false
  # -- IngressClass name.
  className: ""
  # -- Ingress annotations, for example your controller's external-auth settings.
  annotations: {}
  # -- Hosts and paths. Paths default to / (Prefix).
  hosts: []
  #  - host: dash.example.internal
  #    paths:
  #      - path: /
  #        pathType: Prefix
  # -- TLS blocks.
  tls: []

httpRoute:
  # -- Render a Gateway API HTTPRoute. Needs the Gateway API CRDs, and in local mode exposure.authenticatedBy.
  enabled: false
  # -- Gateways the route attaches to.
  parentRefs: []
  # -- Hostnames for the route.
  hostnames: []
  # -- Route annotations.
  annotations: {}

networkPolicy:
  # -- Render a NetworkPolicy for the app pod. The bundled Valkey has its own, rendered whenever it is enabled.
  enabled: false
  # -- Peers allowed to reach the dashboard port, besides pods in the release namespace. Any NetworkPolicyPeer, passed through verbatim: podSelector, namespaceSelector or ipBlock (for example a cloud load balancer's health-check ranges).
  ingressFrom: []
  egress:
    # -- Allow DNS to any destination on port 53.
    dns: true
    # -- Allow HTTPS (443) to any destination, for api.github.com.
    https: true
    redis:
      # -- Server mode: allow egress to Redis/Valkey. Ignored in local mode.
      enabled: true
      # -- External Redis port. 6379 by default; Memorystore with in-transit encryption uses 6378. The bundled Valkey always uses 6379.
      port: 6379
      # -- External Redis only (valkey.enabled=false): peers it lives at, any NetworkPolicyPeer passed through verbatim (ipBlock for a managed instance's private IP, podSelector for an in-cluster one). Empty means any destination on that port. Ignored with the bundled Valkey, which is allowed automatically.
      to: []
    # -- Extra egress rules, for example to an HTTP proxy.
    extra: []

proxy:
  # -- HTTPS_PROXY for calls to GitHub.
  httpsProxy: ""
  # -- HTTP_PROXY.
  httpProxy: ""
  # -- NO_PROXY.
  noProxy: ""

trustedCA:
  # -- ConfigMap of extra PEM CA certificates to trust, for TLS-inspecting proxies. Every key becomes a file.
  configMapName: ""

# -- Extra environment variables for the container.
extraEnv: []
# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity.
affinity: {}
# -- PriorityClass name.
priorityClassName: ""
