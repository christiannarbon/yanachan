{{- /* Rendered whenever the Valkey is, independent of the app's own policy. */}}
{{- if include "yana.valkey.enabled" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "yana.valkey.fullname" . }}
  labels:
    {{- include "yana.valkey.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "yana.valkey.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Only the dashboard's own pods. Probes are exec, so the kubelet needs no rule.
    - from:
        - podSelector:
            matchLabels:
              {{- include "yana.selectorLabels" . | nindent 14 }}
      ports:
        - port: 6379
          protocol: TCP
  # Valkey talks to nobody.
  egress: []
{{- end }}
