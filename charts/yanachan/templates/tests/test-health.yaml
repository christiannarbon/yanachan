apiVersion: v1
kind: Pod
metadata:
  name: {{ include "yana.fullname" . }}-test-health
  # Not the app's selector labels: the app's NetworkPolicy would select this pod
  # and drop its request to the app.
  labels:
    helm.sh/chart: {{ include "yana.chart" . }}
    app.kubernetes.io/name: {{ printf "%s-test" (include "yana.name" .) | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: test
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: yanachan
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: health
      image: {{ include "yana.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      # /api/health is exempt from the Host allowlist, so the Service name works.
      command: ["wget", "-q", "-O-", "http://{{ include "yana.fullname" . }}:{{ .Values.service.port }}/api/health"]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
