# For teams that keep credentials in a secret manager and sync them in with
# External Secrets (Sealed Secrets works the same way). The chart never creates
# a Secret; it only reads the one named here. Combine it with your own auth
# values.
#
# An ExternalSecret that produces it. Not rendered by the chart; apply it
# yourself. Only the keys for your mode need to exist: github-client-secret,
# session-keys and redis-password in server mode (redis-password is optional
# with an external Redis that has no password), gh-token and github-client-id
# in local mode, both optional. On GKE the Redis password can come from Secret
# Manager the same way.
#
#   apiVersion: external-secrets.io/v1
#   kind: ExternalSecret
#   metadata:
#     name: yanachan-github
#     namespace: yanachan
#   spec:
#     refreshInterval: 1h
#     secretStoreRef:
#       kind: ClusterSecretStore
#       name: <your-store>
#     target:
#       name: yanachan-github
#     data:
#       # server mode
#       - secretKey: github-client-secret
#         remoteRef: {key: yanachan/github-client-secret}
#       - secretKey: session-keys
#         remoteRef: {key: yanachan/session-keys}
#       - secretKey: redis-password
#         remoteRef: {key: yanachan/redis-password}
#       # local mode
#       # - secretKey: gh-token
#       #   remoteRef: {key: yanachan/gh-token}
#       # - secretKey: github-client-id
#       #   remoteRef: {key: yanachan/github-client-id}
#
# Rotating session-keys in the secret manager is the same sequence as anywhere
# else: prepend the new key (<new>,<old>), let it sync, run
# `kubectl -n yanachan rollout restart deploy/yanachan`, wait auth.sessionMax,
# then remove <old> and restart again. The app reads the Secret only at start,
# so a sync alone changes nothing until the restart.

auth:
  existingSecret: yanachan-github
