# Test-only external Valkey for chart CI (the external-Redis path). Not for
# production and not the bundled Valkey: no persistence, no TLS, one replica.
# valkey/valkey:9.1.3-alpine, multi-arch index digest checked 2026-11-13.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels: {app: valkey}
spec:
  replicas: 1
  selector: {matchLabels: {app: valkey}}
  template:
    metadata: {labels: {app: valkey}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valkey
          image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
          args: ["--requirepass", "$(VALKEY_PASSWORD)", "--save", "", "--appendonly", "no"]
          env:
            # Same Secret and key the app reads, so the two cannot disagree.
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef: {name: yanachan, key: redis-password}
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector: {app: valkey}
  ports: [{name: redis, port: 6379, targetPort: redis}]
