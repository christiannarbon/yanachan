# Dependency updates.
#
# The Go toolchain is pinned in backend/go.mod by hand; the gomod entry only
# moves go-redis and what it pulls in.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # The workflow pins actions to major versions; this is what moves them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # The Dockerfile pins its base images by digest rather than tag, on purpose:
  # a tag is mutable and a rebuilt upstream would silently change what goes
  # into the binary. The cost of that is a manual refresh, which is exactly
  # what this automates.
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # Grouped and monthly: the frontend has six packages and a stream of
  # individual bumps would be noise rather than signal.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      # Minor and patch only. A major is the one update that needs reading
      # rather than merging, and grouping it means a single unmergeable major
      # holds every other update in the batch hostage -- which is exactly what
      # happened when typescript 7 arrived here and could not build, because
      # vue-tsc still resolves `typescript/lib/tsc` and 7 no longer exports it.
      # Outside the group, a major arrives on its own and blocks nothing else.
      frontend:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    ignore:
      # typescript 7 is the Go rewrite, and it dropped the `typescript/lib/tsc`
      # export that vue-tsc resolves to drive the compiler -- so `npm run
      # typecheck` and `npm run build` both die on ERR_PACKAGE_PATH_NOT_EXPORTED
      # the moment it is installed. No released vue-tsc supports it yet (3.3.11
      # is the latest, and its peer range of >=5.0.0 is what lets npm install a
      # 7 that cannot run). Drop this entry once vue-tsc ships TypeScript 7
      # support; the major is worth taking then.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
