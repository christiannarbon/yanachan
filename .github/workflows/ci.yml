name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing here writes to the repository. The image job builds but never pushes,
# so the token needs no more than read access to the checkout.
permissions:
  contents: read

# A new push to a pull request makes the previous run's answer irrelevant.
# Runs on main are left alone so the history of what passed stays intact.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The same pin as VALKEY_IMAGE in the Makefile. Dependabot does not see it here;
# refresh both together.
env:
  VALKEY_IMAGE: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The toolchain is pinned in go.mod precisely so a local build, the
          # Docker build and this run agree. Reading it from there means the
          # pin has one home.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean; run 'make fmt'"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt clean"

      - name: go vet
        run: go vet ./...

      # -race because the one piece of shared mutable state in the backend is
      # state.Store, guarded by an RWMutex, and a lost lock there is exactly
      # the bug that passes a serial test run.
      - name: go test
        run: go test -race -count=1 ./...

  # The memory store passes the conformance suite in the backend job; this is
  # the same suite, the server-mode end-to-end tests and a boot of the binary
  # against a real Valkey. Valkey is started by hand rather than as a service
  # container, because a service cannot be given a password or have
  # persistence turned off. The password is random per run.
  redis:
    name: Redis/Valkey
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Start Valkey
        run: |
          set -euo pipefail
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "GHDASH_TEST_REDIS_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run -d --name valkey -p 127.0.0.1:6379:6379 "$VALKEY_IMAGE" \
            valkey-server --requirepass "$pw" --save "" --appendonly no
          for _ in $(seq 1 30); do
            docker exec valkey valkey-cli -a "$pw" --no-auth-warning ping 2>/dev/null | grep -q PONG && exit 0
            sleep 1
          done
          echo "::error::Valkey did not start"
          exit 1

      - name: kv and end-to-end tests against Valkey
        env:
          GHDASH_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          go test -race -count=1 -v ./internal/kv/... | tee "$RUNNER_TEMP/kv.log"
          go test -race -count=1 -v -run 'TestE2E' ./internal/api/ | tee "$RUNNER_TEMP/e2e.log"
        shell: bash -o pipefail {0}

      # A missing env var turns the kv tests into skips, and a skip is green.
      # The e2e tests do not skip; they quietly fall back to the memory store,
      # so the check there is that they ran at all.
      - name: Make sure the suites ran against Valkey
        run: |
          if grep -q -- '--- SKIP: TestRedisConformance' "$RUNNER_TEMP/kv.log"; then
            echo "::error::TestRedisConformance was skipped"
            exit 1
          fi
          grep -q -- '--- PASS: TestRedisConformance ' "$RUNNER_TEMP/kv.log"
          grep -q -- '--- PASS: TestE2ENoSecretAnywhere ' "$RUNNER_TEMP/e2e.log"
          grep -q 'e2e store: redis' "$RUNNER_TEMP/e2e.log"

      - name: Smoke test server mode
        env:
          GHDASH_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/yanachan" ./cmd/server
          GHDASH_REDIS_PASSWORD="$GHDASH_TEST_REDIS_PASSWORD" \
            ../scripts/smoke-server-mode.sh "$RUNNER_TEMP/yanachan" valkey

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Matching the node the Dockerfile builds the bundle with.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly the lockfile and fails when the
      # lockfile and package.json disagree, which is the drift worth catching.
      - name: npm ci
        run: npm ci

      # Run separately from the build even though `npm run build` type-checks
      # first, so a type error reports as a type error. This is also where a
      # key added to en.ts and not ja.ts fails: ja.ts is typed as the shape of
      # en.ts, and vue-tsc is what enforces it.
      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # This scans the standard library at the toolchain pinned in go.mod and
      # go-redis, the one third-party module, which holds the session store's
      # connection. The standard library side is not a small surface either:
      # the GitHub token travels through crypto/tls, crypto/x509 and net/http.
      # govulncheck reports only the vulnerabilities this code actually reaches.
      #
      # Pinned, so a green tick means the same check it meant last week. The
      # pin still has to keep pace with the `go` directive, though: govulncheck
      # parses the source it scans, so a version older than the toolchain can
      # meet syntax it does not know and panic rather than report.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci

      # The image ships this file, so a dependency bump that skips
      # `make notices` would ship notices that no longer match the binary.
      - name: Third-party notices are current
        run: |
          set -euo pipefail
          make notices
          git diff --exit-code THIRD_PARTY_NOTICES.md \
            || { echo "::error::THIRD_PARTY_NOTICES.md is out of date; run make notices and commit it"; exit 1; }

      # The same target a developer runs: build the bundle, stage it into
      # internal/webui/dist, compile the binary with it embedded.
      - name: make build
        run: make build

      # The two halves compile separately in the jobs above. This is the only
      # place the shipped artefact -- one binary with the frontend inside it --
      # is proven to exist and answer.
      - name: Smoke test the binary
        run: |
          set -euo pipefail
          state=$(mktemp -d)
          GHDASH_ADDR=127.0.0.1:19080 GHDASH_STATE_DIR="$state" ./bin/yanachan &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:19080/api/health >/dev/null && break
            sleep 1
          done

          curl -sf http://127.0.0.1:19080/api/health | grep -q '"status":"ok"'
          echo "  health answers"

          # A binary built without the bundle staged still compiles -- only
          # .gitkeep is tracked in the embed directory -- and answers this
          # with "frontend bundle is missing". So this is the embed check.
          curl -sf http://127.0.0.1:19080/ | grep -q 'id="app"'
          echo "  frontend is embedded"

          # An unmatched API path must answer JSON, not index.html with a 200
          # that the frontend would then try to JSON.parse.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19080/api/nope)
          test "$code" = 404
          echo "  unmatched api route answers 404"

          # The dashboard endpoints need a session and must say so rather than
          # rendering an empty board.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19080/api/board)
          test "$code" = 401
          echo "  board requires a session"

          # The DNS-rebinding guard: an unrecognised Host is refused outright.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Host: dns-rebind.example' http://127.0.0.1:19080/api/auth/status)
          test "$code" = 403
          echo "  host allowlist refuses an unknown name"

          # ...and health is exempt from it, which is what lets a Kubernetes
          # probe address the pod by IP.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Host: dns-rebind.example' http://127.0.0.1:19080/api/health)
          test "$code" = 200
          echo "  health is exempt from the allowlist"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yanachan-linux-amd64
          path: bin/yanachan
          retention-days: 7
          if-no-files-found: error

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      # Both pinned. A validator that silently changes version is a validator
      # whose green tick means something different every week.
      KUSTOMIZE_VERSION: v5.4.3
      KUBECONFORM_VERSION: v0.6.7
      # The version the manifests are written against, matching make k8s-validate.
      KUBERNETES_VERSION: 1.33.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Downloaded rather than taken from the runner image: what is
      # preinstalled there changes without notice, and a schema check is only
      # worth having if it is the same check every time.
      - name: Install kustomize and kubeconform
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kustomize
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Both overlays, not just dev. prod is the one nobody renders by hand,
      # so it is the one that quietly breaks.
      - name: Render both overlays
        run: |
          set -euo pipefail
          kustomize build k8s/overlays/dev  > "$RUNNER_TEMP/dev.yaml"
          kustomize build k8s/overlays/prod > "$RUNNER_TEMP/prod.yaml"

      - name: Schema check
        run: |
          kubeconform -strict -summary \
            -kubernetes-version "$KUBERNETES_VERSION" \
            "$RUNNER_TEMP/dev.yaml" "$RUNNER_TEMP/prod.yaml"

      # The security posture in k8s/base/deployment.yaml is deliberate and
      # documented; each of these is one edit away from being lost, and none
      # of them fails visibly when it is.
      - name: Assert the pod hardening survived
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP/dev.yaml" "$RUNNER_TEMP/prod.yaml"; do
            for setting in \
              'runAsNonRoot: true' \
              'readOnlyRootFilesystem: true' \
              'allowPrivilegeEscalation: false' \
              'automountServiceAccountToken: false' \
              'type: Recreate'
            do
              if ! grep -q "$setting" "$file"; then
                echo "::error file=k8s/base/deployment.yaml::$(basename "$file") lost '$setting'"
                exit 1
              fi
            done
            echo "  $(basename "$file") ok"
          done

      # ClusterIP with no Ingress is a security decision, not an oversight:
      # the pod holds a GitHub token and has no login of its own.
      - name: Assert nothing exposes the service
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP/dev.yaml" "$RUNNER_TEMP/prod.yaml"; do
            if grep -qE '^kind: Ingress|type: (LoadBalancer|NodePort)' "$file"; then
              echo "::error::$(basename "$file") exposes the service; see docs/tech/architecture/security.md"
              exit 1
            fi
          done
          echo "  service stays ClusterIP in both overlays"

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only to run the arm64 image; the build itself cross-compiles.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # What a release ships: both platforms from one build. Nothing is loaded
      # or pushed; the steps below load one platform at a time from the cache.
      - name: Build every release platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          # The commit changes every run, so go build and the labels rebuild
          # anyway; the fixed date only keeps the later builds in this job
          # identical to this one, so they come from its cache.
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Built, never pushed. This job answers "does the multi-stage build still
      # work", which is a different question from anything the jobs above ask:
      # it is the only place the pinned base image digests are exercised.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: yanachan:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name yana-ci -p 127.0.0.1:19080:19080 yanachan:ci
          trap 'docker logs yana-ci 2>&1 | tail -20; docker rm -f yana-ci >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:19080/api/health >/dev/null && break
            sleep 1
          done

          curl -sf http://127.0.0.1:19080/api/health | grep -q '"status":"ok"'
          echo "  health answers"

          curl -sf http://127.0.0.1:19080/ | grep -q 'id="app"'
          echo "  frontend is embedded"

          # The runtime layer adds a user for a reason; a rebuild that drops
          # the USER line still passes every other check in this file.
          uid=$(docker exec yana-ci id -u)
          test "$uid" = 10001
          echo "  runs as uid 10001, not root"

          # gh is not in the image, and the ambient-session path must stay off
          # inside a container whatever the binary's own default becomes.
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' yanachan:ci \
            | grep -qx 'GHDASH_ALLOW_GH_CLI=false'
          echo "  gh CLI sign-in is disabled in the image"

          docker run --rm yanachan:ci --version | grep -q '^yanachan ci '
          echo "  the binary is stamped"

          for label in title description source url documentation licenses version revision created; do
            value=$(docker inspect -f "{{ index .Config.Labels \"org.opencontainers.image.$label\" }}" yanachan:ci)
            test -n "$value" || { echo "::error::label org.opencontainers.image.$label is missing"; exit 1; }
          done
          # Non-empty is not enough: without build-args these are dev, none, unknown.
          label() { docker inspect -f "{{ index .Config.Labels \"org.opencontainers.image.$1\" }}" yanachan:ci; }
          test "$(label version)" = ci || { echo "::error::version label is $(label version), not ci"; exit 1; }
          test "$(label revision)" = "$GITHUB_SHA" || { echo "::error::revision label is $(label revision), not $GITHUB_SHA"; exit 1; }
          test "$(label created)" = 1970-01-01T00:00:00Z || { echo "::error::created label is $(label created)"; exit 1; }
          echo "  OCI labels present and stamped"
          docker run --rm --entrypoint ls yanachan:ci \
            /usr/share/licenses/yanachan/LICENSE /usr/share/licenses/yanachan/THIRD_PARTY_NOTICES.md >/dev/null
          echo "  licence and notices shipped in the image"

      # The image defaults to local mode, but a cluster runs it in server mode,
      # so both have to start from the same image.
      - name: Smoke test server mode
        run: |
          set -euo pipefail
          if docker run --rm -e GHDASH_AUTH_MODE=server yanachan:ci >/tmp/half.log 2>&1; then
            echo "::error::server mode started without its configuration"; cat /tmp/half.log; exit 1
          fi
          grep -q 'config: ' /tmp/half.log || { echo "::error::no config: line"; cat /tmp/half.log; exit 1; }
          echo "  half-configured server mode refuses to start"

          # Generated here, never committed. The client ID and secret are
          # placeholders: nothing in this step talks to GitHub.
          key=$(head -c32 /dev/urandom | base64)
          rpw=$(head -c24 /dev/urandom | base64 | tr -d '/+=')
          echo "::add-mask::$key"
          echo "::add-mask::$rpw"
          srv_env=(-e GHDASH_AUTH_MODE=server
            -e GITHUB_CLIENT_ID=ci-placeholder-client-id
            -e GITHUB_CLIENT_SECRET=ci-placeholder-client-secret
            -e GHDASH_SESSION_KEYS="$key"
            -e GHDASH_PUBLIC_URL=http://localhost:19080
            -e GHDASH_ALLOW_ANY_USER=true
            -e GHDASH_REDIS_URL=redis://valkey:6379/0
            -e GHDASH_REDIS_PASSWORD="$rpw")
          docker network create yana-ci >/dev/null
          trap 'docker logs yana-srv 2>&1 | tail -20; docker rm -f yana-srv valkey >/dev/null 2>&1 || true; docker network rm yana-ci >/dev/null 2>&1 || true' EXIT

          if docker run --rm --network yana-ci "${srv_env[@]}" yanachan:ci >/tmp/noredis.log 2>&1; then
            echo "::error::server mode started without Redis"; exit 1
          fi
          grep -qi redis /tmp/noredis.log || { echo "::error::no Redis error in the log"; cat /tmp/noredis.log; exit 1; }
          echo "  server mode refuses to start without Redis"

          docker run -d --name valkey --network yana-ci "$VALKEY_IMAGE" \
            valkey-server --requirepass "$rpw" --save "" --appendonly no >/dev/null
          docker run -d --name yana-srv --network yana-ci -p 127.0.0.1:19082:19080 "${srv_env[@]}" yanachan:ci >/dev/null
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:19082/api/ready >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:19082/api/ready >/dev/null
          echo "  /api/ready is 200 with Valkey up"

          # The Host allowlist admits the public URL's host, localhost here.
          curl -sf -H 'Host: localhost:19080' http://127.0.0.1:19082/api/auth/status >/tmp/status.json
          grep -q '"authMode":"server"' /tmp/status.json
          grep -q '"loginUrl":"/api/auth/login"' /tmp/status.json
          no_secret_in_logs() {
            if cat /tmp/half.log /tmp/noredis.log <(docker logs yana-srv 2>&1) \
                | grep -q -F -e "$key" -e "$rpw" -e ci-placeholder-client-secret; then
              echo "::error::a secret reached the log"; exit 1
            fi
          }
          no_secret_in_logs
          echo "  server mode starts, reports itself, and logs no secret"

          docker stop valkey >/dev/null
          sleep 3
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19082/api/ready)" = 503
          curl -sf http://127.0.0.1:19082/api/health >/dev/null
          docker inspect -f '{{.State.Running}}' yana-srv | grep -q true
          echo "  /api/ready is 503 without Valkey; /api/health still 200; still running"
          # Connection errors are where a password would leak, so search again.
          no_secret_in_logs
          echo "  the outage logged no secret"

      # Measured inside the container: .Size depends on the image store
      # (compressed or not), du does not. About 22 MiB on 2026-11-11.
      - name: Check the image size
        run: |
          set -euo pipefail
          kib=$(docker run --rm --user 0 --entrypoint du yanachan:ci -sxk / | awk '{print $1}')
          echo "image size: $((kib / 1024)) MiB"
          test "$kib" -lt $((35 * 1024)) || { echo "::error::image grew past 35 MiB ($((kib / 1024)) MiB)"; exit 1; }

      - name: Build arm64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: yanachan:ci-arm64
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
          cache-from: type=gha

      - name: Smoke test arm64
        run: |
          set -euo pipefail
          test "$(docker inspect -f '{{.Architecture}}' yanachan:ci-arm64)" = arm64
          docker run --rm --platform linux/arm64 yanachan:ci-arm64 --version | grep -q '^yanachan ci '
          docker run -d --name yana-arm --platform linux/arm64 -p 127.0.0.1:19081:19080 yanachan:ci-arm64 >/dev/null
          trap 'docker logs yana-arm 2>&1 | tail -20; docker rm -f yana-arm >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:19081/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:19081/api/health | grep -q '"status":"ok"'
          echo "  arm64 image answers"

      # CRITICAL and fixable fails; HIGH, and anything without a fix, does not.
      # See docs/tech/ci.md for why. Last, because a newly published CVE can
      # fail it with no code change, and that must not hide the other checks.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: yanachan:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # No npm install: the checker is dependency-free on purpose, so this job
      # is a few seconds rather than an install.
      - name: Check internal links
        run: make docs-check
