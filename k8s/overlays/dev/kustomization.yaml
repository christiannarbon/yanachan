apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: yana-chan-4k

resources:
  - ../../base

patches:
  - path: dev-resources.yaml

# The secret is created out of band by `make k8s-secret`, which asks before it
# forwards your local gh CLI token into the cluster. Both keys are marked
# optional in the Deployment, so the app starts without it and you can sign in
# with the OAuth device flow instead.

images:
  - name: yanachan
    newTag: dev
