services:
  dashboard:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ${GHDASH_IMAGE:-yanachan:dev}
    container_name: yana-chan-4k
    # Bound to loopback: the dashboard holds a GitHub token and has no login
    # of its own.
    ports:
      - "127.0.0.1:${GHDASH_API_PORT:-19080}:19080"
    environment:
      GHDASH_ADDR: ":19080"
      GHDASH_STATE_DIR: "/data"
      # gh is not installed in the image; the host session is forwarded as a
      # token instead (see the docker-up target in the Makefile).
      GHDASH_ALLOW_GH_CLI: "false"
      GH_TOKEN: "${GH_TOKEN:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
    volumes:
      - dashboard-state:/data
    restart: unless-stopped

volumes:
  dashboard-state:
